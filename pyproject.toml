[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ecodeck"
version = "0.4.1"
description = "Seu som, na hora certa. Soundboard livre para Windows."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{name = "Murilo Siqueira Toledo"}]
dependencies = [
  "PySide6-Essentials>=6.8,<7",
  "numpy>=2.1,<3",
  "sounddevice>=0.5,<0.6",
  "soundfile>=0.13,<0.14",
  "soxr>=0.5,<2",
  "yt-dlp[default]>=2026.10,<2027",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "pyinstaller>=6.12,<7"]

[project.scripts]
crashsounds = "ecodeck.app:main"
ecodeck = "ecodeck.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
