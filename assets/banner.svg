<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">CrashSounds — seu som, na hora certa.</title>
  <desc id="desc">Soundboard livre para Windows, com um símbolo de ondas sonoras e fundo roxo escuro.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#11101d"/><stop offset="1" stop-color="#30204e"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <g fill="none" stroke="#a78bfa" opacity=".12">
    <circle cx="1150" cy="180" r="100"/><circle cx="1150" cy="180" r="170"/><circle cx="1150" cy="180" r="240"/>
  </g>
  <rect x="72" y="105" width="142" height="142" rx="36" fill="url(#accent)"/>
  <g fill="white">
    <rect x="100" y="161" width="10" height="32" rx="5"/><rect x="120" y="145" width="10" height="64" rx="5"/>
    <rect x="140" y="130" width="10" height="94" rx="5"/><rect x="160" y="151" width="10" height="52" rx="5"/>
    <rect x="180" y="165" width="10" height="24" rx="5"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="258" y="133" font-size="14" font-weight="700" letter-spacing="4" fill="#c4b5fd">SOUNDBOARD LIVRE PARA WINDOWS</text>
    <text x="254" y="211" font-size="76" font-weight="700" fill="#faf5ff">CrashSounds</text>
    <text x="258" y="254" font-size="25" fill="#d5cce8">Seu som, na hora certa.</text>
    <text x="1040" y="306" font-size="15" fill="#c4b5fd">LOCAL. LIVRE. SEU.</text>
  </g>
</svg>
