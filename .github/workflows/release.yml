name: Executável Windows
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Instalar dependências fixadas
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Validar tag da release
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python -c "import os; from ecodeck import __version__; assert os.environ['RELEASE_TAG'] == 'v' + __version__, 'Atualize versao e tag antes de publicar'"
      - run: python -m ruff check .
      - uses: actions/cache@v4
        with:
          path: .tools/media-archives
          key: media-tools-${{ runner.os }}-${{ hashFiles('scripts/media-tools.json') }}
      - name: Preparar ferramentas de mídia verificadas
        run: python scripts/prepare_media_tools.py
      - run: python -m pytest -q
      - name: Gerar executável e validar QA empacotado
        run: python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: CrashSounds-windows-x64
          path: |
            dist/CrashSounds-windows-x64.zip
            dist/*-setup.exe
            dist/SHA256SUMS.txt
            dist/BUILD_TOOLS.json
            dist/MEDIA_TOOLS.json
      - name: Anexar à release publicada
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$env:RELEASE_TAG" dist/CrashSounds-windows-x64.zip dist/*-setup.exe dist/SHA256SUMS.txt dist/BUILD_TOOLS.json dist/MEDIA_TOOLS.json
